<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aprende Docker implementando Home Assistant de verdad, paso a paso y con misiones reales." />
    <meta name="theme-color" content="#2496ed" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet" />
    <title>HomeLab Quest</title>
    <script>
      // Aplica el tema elegido antes del primer pintado (evita el destello del tema equivocado).
      try {
        var saved = JSON.parse(localStorage.getItem('homelab-quest:ui') || '{}')
        var theme = saved.state && saved.state.theme
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
